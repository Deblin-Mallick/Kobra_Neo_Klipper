# --- Klipper Default Templates (Required) ---

[display_template _heater_temperature]
param_heater_name: "extruder"
text:
  {% if param_heater_name in printer %}
    {% set heater = printer[param_heater_name] %}
    {% if param_heater_name == "heater_bed" %}
      {% if heater.target %}
        {% set frame = (printer.toolhead.estimated_print_time|int % 2) + 1 %}
        ~bed_heat{frame}~
      {% else %}
        ~bed~
      {% endif %}
    {% else %}
      ~extruder~
    {% endif %}
    { "%3.0f" % (heater.temperature,) }
    {% if heater.target and (heater.temperature - heater.target)|abs > 2 %}
      ~right_arrow~
      { "%0.0f" % (heater.target,) }
    {% endif %}
    ~degrees~
  {% endif %}

[display_template _fan_speed]
text:
  {% if 'fan' in printer %}
    {% set speed = printer.fan.speed %}
    {% if speed %}
      {% set frame = (printer.toolhead.estimated_print_time|int % 2) + 1 %}
      ~fan{frame}~
    {% else %}
      ~fan1~
    {% endif %}
    { "{:>4.0%}".format(speed) }
  {% endif %}

[display_template _printing_time]
text:
  {% set ptime = printer.idle_timeout.printing_time %}
  { "%02d:%02d" % (ptime // (60 * 60), (ptime // 60) % 60) }

[display_template _print_status]
text:
  {% if printer.display_status.message %}
    { printer.display_status.message }
  {% elif printer.idle_timeout.printing_time %}
    {% set pos = printer.toolhead.position %}
    { "X%-4.0fY%-4.0fZ%-5.2f" % (pos.x, pos.y, pos.z) }
  {% else %}
    Ready
  {% endif %}

# --- Probe Calibration Menu ---
[menu __main __setup __calib __probe_calibrate]
type: list
enable: {not printer.idle_timeout.state == "Printing"}
name: Probe Calibrate

[menu __main __setup __calib __probe_calibrate __start]
type: command
name: Start Calibrate
gcode:
    G28
    PROBE_CALIBRATE

[gcode_macro _PROBE_CALIBRATE_VARS]
variable_last_val: 0
gcode:

[gcode_macro _PROBE_CALIBRATE_APPLY]
gcode:
    {% set target = params.INPUT|float %}
    {% set step = params.STEP|float %}
    {% set vars = printer["gcode_macro _PROBE_CALIBRATE_VARS"] %}
    {% set diff = target - vars.last_val %}
    {% if diff != 0 %}
        TESTZ Z={diff * step}
        SET_GCODE_VARIABLE MACRO=_PROBE_CALIBRATE_VARS VARIABLE=last_val VALUE={target}
    {% endif %}

[menu __main __setup __calib __probe_calibrate __move_005]
type: input
name: Z.005 Turn{% set diff = menu.input - printer["gcode_macro _PROBE_CALIBRATE_VARS"].last_val|default(0) %}{% if diff > 0.0001 %}~up_arrow~{% elif diff < -0.0001 %}~down_arrow~{% else %} {% endif %}
input: {printer["gcode_macro _PROBE_CALIBRATE_VARS"].last_val|default(0)}
input_min: -1000
input_max: 1000
input_step: 1
realtime: True
gcode: _PROBE_CALIBRATE_APPLY INPUT={menu.input} STEP=0.005

[menu __main __setup __calib __probe_calibrate __move_01]
type: input
name: Z.010 Turn{% set diff = menu.input - printer["gcode_macro _PROBE_CALIBRATE_VARS"].last_val|default(0) %}{% if diff > 0.0001 %}~up_arrow~{% elif diff < -0.0001 %}~down_arrow~{% else %} {% endif %}
input: {printer["gcode_macro _PROBE_CALIBRATE_VARS"].last_val|default(0)}
input_min: -1000
input_max: 1000
input_step: 1
realtime: True
gcode: _PROBE_CALIBRATE_APPLY INPUT={menu.input} STEP=0.010

[menu __main __setup __calib __probe_calibrate __move_025]
type: input
name: Z.025 Turn{% set diff = menu.input - printer["gcode_macro _PROBE_CALIBRATE_VARS"].last_val|default(0) %}{% if diff > 0.0001 %}~up_arrow~{% elif diff < -0.0001 %}~down_arrow~{% else %} {% endif %}
input: {printer["gcode_macro _PROBE_CALIBRATE_VARS"].last_val|default(0)}
input_min: -1000
