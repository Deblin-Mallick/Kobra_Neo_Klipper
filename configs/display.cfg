# ======================================================================
# Kobra Neo Spacious Display Configuration
# ======================================================================

[display]
# lcd_type: st7789v
display_group: _kobra_neo_spacious

# --- Spacious 20x8 Layout ---

[display_data _kobra_neo_spacious title]
position: 0, 0
text: Anycubic Kobra Neo

[display_data _kobra_neo_spacious heaters]
position: 1, 0
text:
  { render("_heater_temperature", param_heater_name="heater_bed") }  { render("_heater_temperature", param_heater_name="extruder") }

[display_data _kobra_neo_spacious fan_and_usb]
position: 2, 0
text:
  { render("_fan_speed") }    {% if 'virtual_sdcard' in printer and printer.virtual_sdcard.progress %}~sd~{% else %}~usb~{% endif %}

[display_data _kobra_neo_spacious filename]
position: 3, 0
text:
  {% if printer.print_stats.filename %}
    PRINTING: {printer.print_stats.filename[:10]}
  {% endif %}

[display_data _kobra_neo_spacious progress_bar]
position: 4, 0
text:
  {% set progress = printer.display_status.progress %}
  {% set width = 18 %}
  {% set filled = (progress * width)|int %}
  {% set empty = width - filled %}
  [{ "~prog~" * filled }{ " " * empty }]

[display_data _kobra_neo_spacious z_and_time]
position: 5, 0
text:
  {% set pos = printer.toolhead.position %}
  Z:{ "%-5.1f" % (pos.z) }mm  T:{ render("_printing_time").strip() }

[display_data _kobra_neo_spacious motors_off]
position: 6, 0
text: /// MOTORS-OFF     ^

[display_data _kobra_neo_spacious print_status]
position: 7, 0
text: { render("_print_status") }

