# --- Main Menu Z-Offset ---

[menu __main __zoffset]
type: list
name: Z Offset

[menu __main __zoffset __adj_001]
type: input
name: Z .001:{'% .3f' % menu.input}{% set diff = menu.input - printer.gcode_move.homing_origin.z %}{% if diff > 0.0001 %}~up_arrow~{% elif diff < -0.0001 %}~down_arrow~{% else %} {% endif %}
input: {printer.gcode_move.homing_origin.z}
input_min: -5
input_max: 5
input_step: 0.001
realtime: True
gcode: 
    SET_GCODE_OFFSET Z={'%.3f' % menu.input} MOVE=1

