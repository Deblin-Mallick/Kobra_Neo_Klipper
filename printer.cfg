# Klipper configuration for Anycubic Kobra Neo
# MCU: HC32F460KETA (512K), app at 0x8000
# Built from upstream Klipper3d/klipper
#
# Flash: rename out/klipper.bin to firmware.bin, copy to FAT32 SD,
#        insert with printer off, power on, wait 5 min.

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 3500
max_z_velocity: 6
max_z_accel: 150

# PB6 must be set HIGH to enable MOSFET power for heaters/fans
[output_pin mosfet_power]
pin: PB6
value: 1
shutdown_value: 0

# --- Steppers ---

[stepper_x]
step_pin: PA12
dir_pin: PA11
enable_pin: !PA15
microsteps: 16
rotation_distance: 40
endstop_pin: PH2
position_endstop: -8
position_min: -8
position_max: 230
homing_speed: 50

[stepper_y]
step_pin: PA9
dir_pin: PA8
enable_pin: !PA15
microsteps: 16
rotation_distance: 40
endstop_pin: PC13
position_endstop: -17.5
position_min: -17.5
position_max: 230
homing_speed: 50

[stepper_z]
step_pin: PC7
dir_pin: !PC6
enable_pin: !PA15
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 250
homing_speed: 4

[extruder]
step_pin: PB15
dir_pin: !PB14
enable_pin: !PA15
microsteps: 16
rotation_distance: 7.938
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB8
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PC3
min_temp: 0
max_temp: 275
control: pid
pid_Kp: 10.08
pid_Ki: 0.39
pid_Kd: 65.84
pressure_advance: 0.12

# --- Bed ---

[heater_bed]
heater_pin: PB9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC1
min_temp: -10
max_temp: 120
control: pid
pid_Kp: 97.10
pid_Ki: 1.41
pid_Kd: 1675.16

# --- Probe ---

[probe]
pin: PA1
x_offset: 37.5
y_offset: 0
#z_offset: 0  # Set via PROBE_CALIBRATE
speed: 4
samples: 3
sample_retract_dist: 2

[safe_z_home]
home_xy_position: 115, 115
speed: 100
z_hop: 10
z_hop_speed: 6

[bed_mesh]
speed: 150
horizontal_move_z: 5
mesh_min: 47.5, 10
mesh_max: 220, 220
probe_count: 9, 9
algorithm: bicubic

# --- Fans ---

[fan]
pin: PB5

[heater_fan hotend_fan]
pin: PB13
heater: extruder
heater_temp: 50.0

# --- Filament Runout ---

[filament_switch_sensor runout]
switch_pin: !PC15
pause_on_runout: True

# --- Input Shaping ---

[input_shaper]
shaper_freq_x: 40
shaper_freq_y: 40
shaper_type: mzv

# --- Display (ST7789V 320x240 SPI TFT) ---
[display]
lcd_type: st7789v
spi_bus: spi2
cs_pin: PB1
dc_pin: PB0
spi_speed: 12500000

[output_pin tft_backlight]
pin: PC0
value: 1

# --- TMC2208 (standalone, no UART in Klipper) ---
# Steppers are TMC2208 with OTP-programmed settings.
# No UART configuration needed.

[network_status]

