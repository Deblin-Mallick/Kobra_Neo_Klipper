# ============================================================================
# Kobra Neo macros - slicer hooks, filament handling, preheats.
# PAUSE/RESUME/CANCEL_PRINT come from mainsail.cfg; do not redefine here.
# ============================================================================

# Mainsail pause/cancel behavior tuning (parked position, retract length, etc).
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True
variable_custom_park_x    : 5.0
variable_custom_park_y    : 5.0
variable_custom_park_dz   : 10.0
variable_retract          : 1.0
variable_cancel_retract   : 5.0
variable_speed_retract    : 35.0
variable_unretract        : 1.0
variable_speed_unretract  : 35.0
variable_speed_hop        : 15.0
variable_speed_move       : 100.0
variable_park_at_cancel   : True
variable_park_at_cancel_x : 5.0
variable_park_at_cancel_y : 220.0
variable_use_fw_retract   : False
gcode:

# ---------------------------------------------------------------------------
# Slicer entry points
#
# Slicer 'Start G-code':
#   START_PRINT EXTRUDER_TEMP={first_layer_temperature[0]} BED_TEMP={first_layer_bed_temperature[0]}
#
# Slicer 'End G-code':
#   END_PRINT
# ---------------------------------------------------------------------------

[gcode_macro START_PRINT]
description: Preheat, home, prime line. Call from slicer 'start gcode'.
gcode:
  {% set BED      = params.BED_TEMP|default(60)|float %}
  {% set HOTEND   = params.EXTRUDER_TEMP|default(200)|float %}
  CLEAR_PAUSE
  G90
  M82
  G92 E0
  M140 S{BED}
  # Preheat hotend to a non-ooze temp while the bed comes up
  M104 S150
  M190 S{BED}
  G28
  # Uncomment after you have run BED_MESH_CALIBRATE and SAVE_CONFIG:
  #BED_MESH_PROFILE LOAD=default
  M109 S{HOTEND}
  # Prime line along the front edge
  G1 X5 Y5 Z0.3 F3000
  G92 E0
  G1 X120 Y5 E15 F1500
  G1 X120 Y5.4 F3000
  G1 X5 Y5.4 E30 F1500
  G92 E0
  G1 Z2 F600

[gcode_macro END_PRINT]
description: Retract, lift, park, cool, motors off. Call from slicer 'end gcode'.
gcode:
  M400              # finish moves in the queue
  G91
  G1 E-2 F2700      # small retract
  G1 Z5 F900        # lift
  G90
  G1 X5 Y220 F6000  # park back-left, bed forward for easy removal
  TURN_OFF_HEATERS
  M107              # part fan off
  M84               # disable steppers

# ---------------------------------------------------------------------------
# Filament handling
# ---------------------------------------------------------------------------

[gcode_macro LOAD_FILAMENT]
description: Heat to 210 and feed ~60mm of filament.
gcode:
  {% set HOTEND = params.TEMP|default(210)|int %}
  SAVE_GCODE_STATE NAME=load_state
  M109 S{HOTEND}
  G91
  G1 E50 F300       # bulk feed to nozzle
  G1 E10 F150       # slow last 10mm
  G90
  G92 E0
  RESTORE_GCODE_STATE NAME=load_state

[gcode_macro UNLOAD_FILAMENT]
description: Heat, retract a few mm, then pull filament fully out.
gcode:
  {% set HOTEND = params.TEMP|default(210)|int %}
  SAVE_GCODE_STATE NAME=unload_state
  M109 S{HOTEND}
  G91
  G1 E10 F150       # push to soften
  G1 E-100 F800     # pull out
  G90
  G92 E0
  RESTORE_GCODE_STATE NAME=unload_state

# ---------------------------------------------------------------------------
# Preheats
# ---------------------------------------------------------------------------

[gcode_macro PREHEAT_PLA]
gcode:
  M140 S60
  M104 S200

[gcode_macro PREHEAT_PETG]
gcode:
  M140 S80
  M104 S235

[gcode_macro PREHEAT_ABS]
gcode:
  M140 S100
  M104 S240

[gcode_macro COOL_DOWN]
gcode:
  TURN_OFF_HEATERS
  M107
