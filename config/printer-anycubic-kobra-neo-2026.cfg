# Anycubic Kobra Neo - Klipper starter config
# Based on the Kobra Go config (same Trigorilla / HC32F460 board) plus Neo
# specifics. Edit before first homing/heating.
#
# Firmware build (this repo's HC32F460 port):
#   - Micro-controller: Huada Semiconductor HC32F460
#   - Serial: PA3 & PA2 (Anycubic) - exposed via on-board CH340 USB
#   - Bootloader offset: 0x8000
# Flash by renaming out/klipper.bin -> firmware.bin on a FAT32 SD card,
# inserting it, and powering on. LCD will show 'Firmware Update' for 3-5 min.
#
# Before first move: PID-tune hotend and bed, run PROBE_CALIBRATE,
# then BED_MESH_CALIBRATE. The values below are inherited from the Kobra Go
# and should be re-tuned for your specific machine.

[mcu]
# Plug the Pi into the printer's USB port and 'ls /dev/serial/by-id/' to find
# the real path; CH340 typically appears as usb-1a86_USB_Serial-if00-port0.
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 500
max_z_velocity: 4
max_z_accel: 100

[stepper_x]
step_pin: PA12
dir_pin: PA11
enable_pin: !PA15
microsteps: 16
rotation_distance: 40
endstop_pin: !PH2
position_endstop: -13
position_min: -13
position_max: 236
homing_speed: 50

[stepper_y]
step_pin: PA9
dir_pin: PA8
enable_pin: !PA15
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PC13
position_endstop: -9
position_min: -9
position_max: 230
homing_speed: 50

[stepper_z]
step_pin: PC7
dir_pin: !PC6
enable_pin: !PA15
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -10
position_max: 250

[extruder]
step_pin: PB15
dir_pin: PB14
enable_pin: !PA15
microsteps: 16
rotation_distance: 31.07
max_extrude_only_velocity: 25
max_extrude_only_accel: 1000
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB8
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC3
min_extrude_temp: 170
min_temp: 0
max_temp: 250
#control: pid
#pid_kp: 19.56
#pid_ki: 1.62
#pid_kd: 200.00

[heater_bed]
heater_pin: PB9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC1
min_temp: 0
max_temp: 120
#control: pid
#pid_kp: 97.1
#pid_ki: 1.41
#pid_kd: 1675.16

[probe]
pin: PA1
x_offset: 37.5
y_offset: 0
z_offset: 1.66  # Marlin reports NOZZLE_TO_PROBE_OFFSET Z=-1.66; PROBE_CALIBRATE to refine
samples: 5
samples_result: median
samples_tolerance: 0.2
samples_tolerance_retries: 10
sample_retract_dist: 2.0
speed: 2
lift_speed: 4

[safe_z_home]
home_xy_position: 72, 110   # nozzle here -> probe at bed center (109.5, 110)
speed: 50
z_hop: 10
z_hop_speed: 15

[screws_tilt_adjust]
# Positions are where the PROBE should land (Klipper moves the nozzle to
# probe_pos + probe.x_offset/y_offset). The Kobra Neo has 4 corner knobs
# inset roughly 30 mm from each bed corner. If a screw doesn't line up
# under the probe at the printed coords below, nudge the value.
screw1: 30, 30
screw1_name: front left
screw2: 190, 30
screw2_name: front right
screw3: 30, 190
screw3_name: back left
screw4: 190, 190
screw4_name: back right
horizontal_move_z: 5
speed: 60
screw_thread: CW-M4  # clockwise to lower the bed (standard for Kobra leveling screws)

[bed_mesh]
speed: 200
horizontal_move_z: 5
mesh_min: 30, 5
mesh_max: 195, 195
probe_count: 5, 5

# Neo has no separate controller/board fan; PB12 is unconnected on this
# board. Only the part fan (PB5) and the hotend auto-fan (PB13) exist.

[heater_fan extruder_fan]
pin: PB13

[fan]
pin: PB5
cycle_time: 0.00005  # 20 kHz

[output_pin enable_pin]
pin: PB6
value: 1
# Master enable for bed, hotend, extruder fan, part fan.

# --- ST7789V SPI TFT display ---
# Pins verified against the working Kobra Neo Marlin pin file
# (pins_ANYCUBIC_KOBRA_NEO.h). No rst_pin: ST7789 powers up via internal
# POR, and PB4 is the encoder button so pulsing it would glitch input.
[display]
lcd_type: st7789v
spi_bus: spi2
cs_pin: PB1
dc_pin: PB0
backlight_pin: PC0

[virtual_sdcard]
path: /home/pi/printer_data/gcodes

[pause_resume]

[display_status]

[include macros.cfg]
[include mainsail.cfg]

